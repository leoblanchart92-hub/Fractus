name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fractus (Windows)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies, analyze, tests, build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $log = "ci-log.txt"
          "flutter: $(flutter --version 2>&1 | Select-Object -First 1)" | Tee-Object -FilePath $log
          $steps = @(
            @{ name = "pub get";  cmd = { flutter pub get } },
            @{ name = "analyze";  cmd = { flutter analyze --no-fatal-infos --no-fatal-warnings } },
            @{ name = "test";     cmd = { flutter test } },
            @{ name = "build";    cmd = { flutter build windows --release } }
          )
          $failed = ""
          foreach ($s in $steps) {
            "`n=== $($s.name) ===" | Tee-Object -FilePath $log -Append
            & $s.cmd 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { $failed = $s.name; "`n>>> ÉCHEC : $($s.name) (code $LASTEXITCODE)" | Tee-Object -FilePath $log -Append; break }
          }
          "failed=$failed" >> $env:GITHUB_OUTPUT

      - name: Publish log as commit comment
        if: always()
        shell: pwsh
        run: |
          $failed = "${{ steps.build.outputs.failed }}"
          $status = if ($failed) { "❌ Échec à l'étape **$failed**" } else { "✅ Build Windows réussi" }
          $lines = Get-Content ci-log.txt -ErrorAction SilentlyContinue
          if ($lines.Count -gt 180) { $lines = @("… ($($lines.Count - 180) lignes omises)") + $lines[-180..-1] }
          $body = "### $status`nRun : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n``````text`n$($lines -join "`n")`n``````"
          if ($body.Length -gt 60000) { $body = $body.Substring($body.Length - 60000) }
          $json = @{ body = $body } | ConvertTo-Json -Compress
          $json | Out-File -FilePath body.json -Encoding utf8
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input body.json > $null

      - name: Fail if a step failed
        if: steps.build.outputs.failed != ''
        shell: pwsh
        run: exit 1

      - name: Version
        id: version
        shell: pwsh
        run: |
          $pub = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $ver = $pub.Split('+')[0]
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $ver) {
              Write-Error "Le tag v$tag ne correspond pas à pubspec.yaml ($ver). Mets à jour 'version:' dans pubspec.yaml avant de taguer, sinon Fractus ne saura pas qu'il est à jour."
              exit 1
            }
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "Version : $ver"

      - name: Package (zip)
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          Copy-Item hook -Destination "$out\hook" -Recurse
          Copy-Item README.md -Destination "$out\README.md"
          Compress-Archive -Path "$out\*" -DestinationPath "Fractus-Windows.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $src = (Resolve-Path "build\windows\x64\runner\Release").Path
          # Le zip a déjà copié hook/ et README dans le dossier : on les retire pour ne pas les doubler.
          Remove-Item "$src\hook" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$src\README.md" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$((Resolve-Path dist).Path)" installer\fractus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Fractus-Windows
          path: Fractus-Windows.zip
          if-no-files-found: error

      - name: Upload artifact (setup)
        uses: actions/upload-artifact@v4
        with:
          name: Fractus-Setup
          path: dist/Fractus-Setup-*.exe
          if-no-files-found: error

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Fractus-Setup-*.exe
            Fractus-Windows.zip
          generate_release_notes: true

  android:
    name: Build Fractus (Android)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android project
        working-directory: mobile
        # Le squelette Android (gradle, icônes, styles) est généré ici ; seuls nos
        # fichiers (manifest, Kotlin, layouts, Dart) sont versionnés et ne sont pas écrasés.
        run: flutter create --platforms=android --project-name fractus_mobile --org app.fractus --no-pub .

      - name: Build APK
        working-directory: mobile
        run: |
          # L'interface de l'île (Fractus, cartes, palette) est celle du PC : on la copie.
          sh tool/sync_shared.sh
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Fractus-Android.apk

      - name: Upload artifact (apk)
        uses: actions/upload-artifact@v4
        with:
          name: Fractus-Android
          path: Fractus-Android.apk
          if-no-files-found: error

      - name: Attach to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # La release est créée par le job Windows : on l'attend (au plus 25 min).
          for i in $(seq 1 50); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" Fractus-Android.apk --clobber --repo "${{ github.repository }}"
              exit 0
            fi
            sleep 30
          done
          echo "Release introuvable" >&2
          exit 1
