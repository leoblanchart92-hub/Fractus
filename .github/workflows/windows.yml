name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fractus (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build (release)
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          Copy-Item hook -Destination "$out\hook" -Recurse
          Copy-Item README.md -Destination "$out\README.md"
          Compress-Archive -Path "$out\*" -DestinationPath "Fractus-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fractus-Windows
          path: Fractus-Windows.zip
          if-no-files-found: error

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Fractus-Windows.zip
          generate_release_notes: true
