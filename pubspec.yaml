name: fractus
description: "Fractus — un petit compagnon en haut de l'écran qui surveille vos agents IA (interface reprise de Coucou)."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Fenêtre sans bordure, toujours au premier plan, hors barre des tâches.
  window_manager: ^0.4.3
  # Position du curseur à l'écran (pour réveiller l'île et que Mochi suive la souris).
  screen_retriever: ^0.2.0
  # Fond de fenêtre réellement transparent sous Windows.
  flutter_acrylic: ^1.1.4
  # Appels HTTP (chat avec un modèle).
  http: ^1.2.0
  # Dossier de réglages (%APPDATA%\fractus).
  path_provider: ^2.1.0
  # Icône dans la zone de notification (Fractus tourne en arrière-plan).
  tray_manager: ^0.5.0
  # Lancement automatique avec Windows (clé Run du registre).
  launch_at_startup: ^0.5.1
  # Version de l'application (pour les mises à jour).
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fractus.ico
